<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 — Nikki Life</title>
<link rel="stylesheet" href="blog.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tw-config.js"></script>
</head>
<body class="bg-paper font-sans text-inksoft overflow-x-hidden" data-page="article">

<!-- NAV -->
<nav class="fixed top-0 inset-x-0 z-50 glass border-b border-taupe/15">
  <div class="max-w-[1200px] mx-auto px-7 py-4 flex justify-between items-center">
    <a href="index.html" class="font-script text-3xl text-taupe">Nikki Life</a>
    <div class="hidden md:flex gap-1 items-center">
      <a href="about.html" data-nav="about" class="text-sm text-taupe px-5 py-2.5 rounded-full hover:bg-cream transition">關於我</a>
      <a href="articles.html" data-nav="articles" class="text-sm text-taupe px-5 py-2.5 rounded-full hover:bg-cream transition">精選文章</a>
      <a href="index.html#works" data-nav="works" class="text-sm text-taupe px-5 py-2.5 rounded-full hover:bg-cream transition">影音創作</a>
      <a href="index.html#contact" class="text-sm text-white bg-taupe px-6 py-2.5 rounded-full hover:opacity-90 transition">聯絡合作</a>
    </div>
    <button id="burger" class="md:hidden text-taupe text-xl" aria-label="選單"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden glass border-t border-taupe/10 px-7 py-3 flex-col gap-1">
    <a href="about.html" class="block text-sm text-taupe py-2">關於我</a>
    <a href="articles.html" class="block text-sm text-taupe py-2">精選文章</a>
    <a href="index.html#works" class="block text-sm text-taupe py-2">影音創作</a>
    <a href="index.html#contact" class="block text-sm text-taupe py-2">聯絡合作</a>
  </div>
</nav>

<!-- ARTICLE HERO -->
<header class="pt-[150px]">
  <div class="max-w-[820px] mx-auto px-7 text-center reveal">
    <div class="font-sans text-[13px] text-inksoft tracking-wide mb-4.5">
      <a href="index.html" class="hover:text-taupe">首頁</a><span class="opacity-50 mx-2">/</span>
      <a href="articles.html" class="hover:text-taupe">精選文章</a><span class="opacity-50 mx-2">/</span><span id="a-crumb-cat"></span>
    </div>
    <div class="flex items-center justify-center gap-3.5 mb-4">
      <span id="a-cat" class="font-sans font-bold text-xs tracking-[0.16em] text-white bg-taupe px-4 py-1.5 rounded-full"></span>
      <span id="a-date" class="font-sans text-sm text-inksoft"></span>
    </div>
    <h1 id="a-title" class="font-serif text-[clamp(2rem,4.4vw,3.25rem)] text-ink leading-[1.25] mb-4.5"></h1>
    <div class="inline-flex items-center gap-3 mt-1.5">
      <img src="../../assets/about-2.jpg" alt="Nikki" class="w-10 h-10 rounded-full object-cover">
      <span class="font-sans text-sm text-inksoft">by Nikki Tai · 閱讀時間約 6 分鐘</span>
    </div>
  </div>
  <div class="max-w-[1040px] mx-auto px-7 mt-12">
    <div class="w-full aspect-video rounded-[30px] overflow-hidden shadow-media reveal"><img id="a-img" src="" alt="" class="w-full h-full object-cover"></div>
  </div>
</header>

<!-- PROSE -->
<article id="a-prose" class="prose max-w-[720px] mx-auto px-7 pt-16 reveal"></article>

<!-- TAGS -->
<div id="a-tags" class="max-w-[720px] mx-auto px-7 mt-12 flex gap-3 flex-wrap items-center reveal"></div>

<!-- PREV / NEXT -->
<nav class="max-w-[1040px] mx-auto px-7 mt-20 grid sm:grid-cols-2 gap-6">
  <a id="a-prev" href="#" class="reveal flex flex-col gap-1.5 px-8 py-7 rounded-[30px] bg-cream hover:bg-greige hover:-translate-y-1 transition-all duration-300">
    <span class="font-sans text-xs tracking-[0.14em] text-taupe uppercase"><i class="fa-solid fa-arrow-left mr-2"></i>上一篇</span>
    <span class="pn-ttl font-serif text-lg text-ink leading-snug"></span>
  </a>
  <a id="a-next" href="#" class="reveal flex flex-col gap-1.5 items-end text-right px-8 py-7 rounded-[30px] bg-cream hover:bg-greige hover:-translate-y-1 transition-all duration-300">
    <span class="font-sans text-xs tracking-[0.14em] text-taupe uppercase">下一篇<i class="fa-solid fa-arrow-right ml-2"></i></span>
    <span class="pn-ttl font-serif text-lg text-ink leading-snug"></span>
  </a>
</nav>

<!-- RELATED -->
<section class="py-24 bg-cream mt-24">
  <div class="max-w-[1120px] mx-auto px-7">
    <div class="text-center mb-14 reveal">
      <span class="t-script text-taupe">You may also like</span>
      <h2 class="t-h1 text-ink mt-1">相關文章</h2>
    </div>
    <div id="a-related" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-7"></div>
  </div>
</section>

<!-- NEWSLETTER -->
<section class="py-24 relative overflow-hidden text-center">
  <div class="max-w-[1200px] mx-auto px-7 relative reveal">
    <h2 class="t-h2 text-ink mb-4">訂閱電子報</h2>
    <p class="text-inksoft max-w-[420px] mx-auto mb-10">不錯過任何一次更新，讓靈感直接送達你的信箱。每週一次，關於創作與生活的精選內容。</p>
    <form data-fake data-ok="已訂閱，請查收你的信箱 ✓" class="flex gap-4 max-w-[480px] mx-auto flex-col sm:flex-row">
      <input type="email" required placeholder="Your Email Address" class="flex-1 px-7 py-4 rounded-full bg-cream outline-none focus:ring-2 focus:ring-taupe/30">
      <button class="px-9 py-4 rounded-full bg-espresso text-white font-bold whitespace-nowrap hover:scale-105 hover:shadow-cta transition">立即訂閱</button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<footer class="pt-16 pb-12 text-center">
  <div class="max-w-[1200px] mx-auto px-7">
    <div class="font-script text-4xl text-taupe mb-8">Nikki Life</div>
    <div class="flex justify-center gap-8 mb-12">
      <a href="#" class="w-12 h-12 rounded-full bg-white shadow-soft grid place-items-center text-taupe text-xl hover:bg-taupe hover:text-white transition"><i class="fa-brands fa-youtube"></i></a>
      <a href="#" class="w-12 h-12 rounded-full bg-white shadow-soft grid place-items-center text-taupe text-xl hover:bg-taupe hover:text-white transition"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="w-12 h-12 rounded-full bg-white shadow-soft grid place-items-center text-taupe text-xl hover:bg-taupe hover:text-white transition"><i class="fa-brands fa-threads"></i></a>
    </div>
    <div class="border-t border-cream pt-8">
      <p class="text-sm text-inksoft">© 2026 Nikki Life. All rights reserved.</p>
      <p class="text-[11px] text-inksoft/60 mt-2 uppercase tracking-[0.18em]">Designed by Jerry Lee</p>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
